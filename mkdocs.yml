# MkDocs configuration for Code and Camera documentation site
site_name: Code and Camera
site_author: J Lock
site_url: https://codeandcamera.me/
site_description: Where Technology Meets Hands-On Innovation - Gardening, Home Lab, Automation, and AI
edit_uri: ""

# Main navigation menu for the documentation site
nav:
  - Home: index.md
  - Gardening & Growing: gardening/index.md
  - Home Lab:
      - homelab/index.md
      - AI-Powered Proxmox MCP: homelab/mcp-proxmox-infrastructure.md
      - ProxmoxMCP-Plus Setup Guide: homelab/proxmox-mcp-setup.md
      - Proxmox API Tokens: homelab/proxmox-api-token.md
      - Proxmox Slack Bot: homelab/proxmox-slack-bot.md
  - Automation:
      - automation/index.md
      - Docker Desktop Cleanup Reference: automation/docker-desktop-cleanup-runbook.md
      - Upgrading to Slack Block Kit: automation/slack-block-kit-upgrade.md
      - Scheduled Proxmox Updates: automation/n8n-scheduled-proxmox-updates.md
  - AI & Machine Learning:
      - ai/index.md
      - Multi-Agent Instructions: ai/multi-agent-instructions.md
      - WakaTime with OpenCode: ai/wakatime-opencode-setup.md
      - AI That Writes About What It Built: ai/openclaw-automated-blog-posts.md
      - AI Agent Harness Workflow: ai/agent-harness-workflow.md


# Bootswatch Flatly theme configuration
theme:
  name: flatly

# Markdown extensions for rich content
markdown_extensions:
  # Basic formatting
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  
  # Admonitions (callouts)
  - admonition
  - pymdownx.details
  
  # Code blocks
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  
  # Content tabs
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  
  # Formatting helpers
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.keys
  
  # Emoji support
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  
  # Task lists
  - pymdownx.tasklist:
      custom_checkbox: true

# Plugins for enhanced functionality
plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

# Extra configuration
extra:
  # Social links in footer
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jdlocklin-backyard
  # Status indicators for pages
  status:
    new: Recently added
    deprecated: Deprecated
# Custom CSS
extra_css:
  - stylesheets/extra.css

